<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive & Mega HTML5 Player Test</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        .test-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #475569;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #2563eb;
        }
        video {
            width: 100%;
            max-height: 450px;
            background: #000;
            border-radius: 6px;
            margin-top: 20px;
            outline: none;
        }
        .log-box {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #38bdf8;
            background: #0f172a;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>HTML5 Video Player - Local Test</h2>

    <div class="test-box">
        <div class="input-group">
            <label>Google Drive அல்லது Mega லிங்க்கை இங்கே போடுங்கள்:</label>
            <input type="text" id="test-url" placeholder="https://drive.google.com/file/d/... அல்லது Mega Link">
        </div>
        <button onclick="testPlayer()">Convert & Play</button>

        <div id="log-status" class="log-box">Status: Ready for testing</div>

        <!-- ஒரிஜினல் HTML5 பிளேயர் (No Iframe) -->
        <video id="local-video-player" controls preload="metadata">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        function testPlayer() {
            let inputVal = document.getElementById('test-url').value.trim();
            let videoEl = document.getElementById('local-video-player');
            let logEl = document.getElementById('log-status');

            if (!inputVal) {
                alert("லிங்க்கை உள்ளிடவும்!");
                return;
            }

            let finalUrl = inputVal;

            // 1. Google Drive Link Conversion
            if (inputVal.includes("drive.google.com")) {
                let match = inputVal.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    let fileId = match[1];
                    // டைரக்ட் ஸ்ட்ரீமிங் லிங்க்காக மாறுவது
                    finalUrl = `https://lh3.googleusercontent.com/d/${fileId}=s0`;
                    logEl.innerText = "Converted Google Drive -> Direct Link: " + finalUrl;
                }
            } 
            // 2. Mega Link Conversion Handling
            else if (inputVal.includes("mega.nz")) {
                // Mega லிங்க்குகள் நேரடியாக பிரவுசரில் HTML5 டேக் மூலம் ஓட பிரத்யேக ஸ்ட்ரீமிங் கீ அல்லது ஃபார்மட் தேவைப்படும்.
                // ஒருவேளை நேரடி எம்பெட் லிங்க்காக மாற்ற வேண்டுமெனில் இங்கே லாஜிக் செயலாக்கப்படும்.
                finalUrl = inputVal; 
                logEl.innerText = "Mega Link loaded: " + finalUrl;
            } else {
                logEl.innerText = "Loaded Direct URL: " + finalUrl;
            }

            // பிளேயரில் லிங்கை செட் செய்து ரன் செய்வது
            videoEl.src = finalUrl;
            videoEl.load();
            videoEl.play().catch(err => {
                console.log("Play error:", err);
                logEl.innerText += " | Note: Browser blocked autoplay or format restricted.";
            });
        }
    </script>

</body>
</html>
