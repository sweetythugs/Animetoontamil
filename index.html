<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeSalt - Ultimate Streaming App</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }
        header {
            padding: 1.2rem 2rem;
            background: #0b0f19;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            color: #38bdf8;
            margin: 0;
            font-size: 1.8rem;
        }
        #user-status {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .container {
            padding: 1.5rem 2rem;
            max-width: 1400px;
            margin: auto;
        }
        .az-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 2rem;
        }
        .az-btn {
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .az-btn:hover, .az-btn.active {
            background: var(--accent-color);
        }
        h2.section-title {
            font-size: 1.2rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            margin: 1.5rem 0 1rem 0;
            color: #38bdf8;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
        }
        .card h3 {
            font-size: 1rem;
            margin: 8px 0 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .meta-info {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .delete-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            flex: 1;
        }
        .edit-btn {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            flex: 1;
        }
        .detail-view {
            display: none;
        }
        .detail-view.active {
            display: block;
        }
        .back-btn {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover {
            background: var(--accent-color);
            color: white;
        }
        
        .post-top-info {
            display: flex;
            gap: 1.5rem;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid #334155;
        }
        .post-top-info img {
            width: 140px;
            height: 190px;
            object-fit: cover;
            border-radius: 6px;
        }
        .post-top-text h2 {
            margin: 0 0 10px 0;
            color: #38bdf8;
            font-size: 1.6rem;
        }
        .post-top-text p {
            margin: 5px 0;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .admob-banner {
            width: 100%;
            max-width: 900px;
            height: 90px;
            background: #111827;
            border: 1px dashed #334155;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 0.85rem;
            border-radius: 6px;
            text-align: center;
        }

        /* Google Drive & Mega Player Container */
        .video-player-wrap {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .video-player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .video-player-container.ratio-4-3 {
            aspect-ratio: 4 / 3;
        }

        .video-player-container.ratio-16-9 {
            aspect-ratio: 16 / 9;
        }

        .video-player-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000;
        }

        .player-fullscreen-btn {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background: #38bdf8;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .video-player-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            aspect-ratio: auto;
            border: 0;
            border-radius: 0;
        }

        .video-player-container:fullscreen iframe {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 600px) {
            .video-player-container {
                border-radius: 0;
                border-left: 0;
                border-right: 0;
            }
        }

        .episode-btn {
            display: block;
            width: 100%;
            max-width: 900px;
            margin: 10px auto;
            background: var(--card-bg);
            color: #38bdf8;
            padding: 12px 16px;
            border-radius: 6px;
            text-align: left;
            border: 1px solid #334155;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .episode-btn:hover, .episode-btn.active-ep {
            background: var(--accent-color);
            color: white;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: #0b0f19;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            background: none; border: none;
            color: #94a3b8; cursor: pointer;
            display: flex; flex-direction: column;
            align-items: center; font-size: 0.75rem; font-weight: bold;
        }
        .nav-item.active, .nav-item:hover { color: #38bdf8; }
        .section { display: none; }
        .section.active { display: block; }
        .search-box input {
            width: 100%; padding: 12px;
            background: var(--card-bg); border: 1px solid #334155;
            color: white; border-radius: 6px; font-size: 1rem;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px;
            background: var(--card-bg); border: 1px solid #334155;
            color: white; border-radius: 5px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <h1>AnimeSalt</h1>
        <div id="user-status">Not Logged In</div>
    </header>

    <div class="container">
        <!-- DETAIL PAGE VIEW -->
        <div id="detail-page" class="detail-view">
            <button class="back-btn" onclick="goBack()">← Back to Home</button>
            
            <div class="post-top-info">
                <img id="detail-img" src="" alt="">
                <div class="post-top-text">
                    <h2 id="detail-title"></h2>
                    <p id="detail-meta"></p>
                    <p id="detail-views" style="color: #38bdf8; font-weight: bold;"></p>
                </div>
            </div>

            <div class="admob-banner">
                <span>[ AdMob Banner Ad - Top ]</span>
            </div>

            <!-- VIDEO PLAYER CONTAINER -->
            <div class="video-player-wrap">
                <div id="video-player-container" class="video-player-container ratio-16-9">
                    <iframe id="main-video-player" src=""
                            allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                            allowfullscreen
                            webkitallowfullscreen
                            mozallowfullscreen></iframe>
                </div>
                <button class="player-fullscreen-btn" type="button" onclick="openPlayerFullscreen()">⛶ Fullscreen</button>
            </div>

            <div class="admob-banner">
                <span>[ AdMob Banner Ad - Bottom ]</span>
            </div>

            <h2 class="section-title" style="max-width: 900px; margin: 1.5rem auto 1rem auto;">Episodes List</h2>
            <div id="detail-links-container"></div>
        </div>

        <!-- MAIN APP SECTIONS -->
        <div id="main-app-content">
            <div id="home" class="section active">
                <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px;">NAVIGATE A TO Z</div>
                <div class="az-bar" id="az-buttons">
                    <button class="az-btn active" onclick="filterByAZ('', this)">#</button>
                    <button class="az-btn" onclick="filterByAZ('A', this)">A</button>
                    <button class="az-btn" onclick="filterByAZ('B', this)">B</button>
                    <button class="az-btn" onclick="filterByAZ('C', this)">C</button>
                    <button class="az-btn" onclick="filterByAZ('D', this)">D</button>
                    <button class="az-btn" onclick="filterByAZ('E', this)">E</button>
                    <button class="az-btn" onclick="filterByAZ('F', this)">F</button>
                    <button class="az-btn" onclick="filterByAZ('G', this)">G</button>
                    <button class="az-btn" onclick="filterByAZ('H', this)">H</button>
                    <button class="az-btn" onclick="filterByAZ('I', this)">I</button>
                    <button class="az-btn" onclick="filterByAZ('J', this)">J</button>
                    <button class="az-btn" onclick="filterByAZ('K', this)">K</button>
                    <button class="az-btn" onclick="filterByAZ('L', this)">L</button>
                    <button class="az-btn" onclick="filterByAZ('M', this)">M</button>
                    <button class="az-btn" onclick="filterByAZ('N', this)">N</button>
                    <button class="az-btn" onclick="filterByAZ('O', this)">O</button>
                    <button class="az-btn" onclick="filterByAZ('P', this)">P</button>
                    <button class="az-btn" onclick="filterByAZ('Q', this)">Q</button>
                    <button class="az-btn" onclick="filterByAZ('R', this)">R</button>
                    <button class="az-btn" onclick="filterByAZ('S', this)">S</button>
                    <button class="az-btn" onclick="filterByAZ('T', this)">T</button>
                    <button class="az-btn" onclick="filterByAZ('U', this)">U</button>
                    <button class="az-btn" onclick="filterByAZ('V', this)">V</button>
                    <button class="az-btn" onclick="filterByAZ('W', this)">W</button>
                    <button class="az-btn" onclick="filterByAZ('X', this)">X</button>
                    <button class="az-btn" onclick="filterByAZ('Y', this)">Y</button>
                    <button class="az-btn" onclick="filterByAZ('Z', this)">Z</button>
                </div>

                <h2 class="section-title">Popular Series</h2>
                <div id="series-grid" class="grid"></div>

                <h2 class="section-title">Popular Movies</h2>
                <div id="movies-grid" class="grid"></div>
            </div>

            <div id="search" class="section">
                <h2 class="section-title">Search Anime</h2>
                <div class="search-box" style="margin-bottom: 1.5rem;">
                    <input type="text" id="search-input" placeholder="Search anime or cartoons..." oninput="handleSearch()">
                </div>
                <div id="search-grid" class="grid"></div>
            </div>

            <div id="upload" class="section">
                <h2 class="section-title" id="form-heading">Upload Post</h2>
                <div id="upload-form-container" style="display:none;">
                    <input type="hidden" id="edit-post-id" value="">
                    
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="post-title" placeholder="E.g. Shinchan Season 1">
                    </div>
                    
                    <div class="form-group">
                        <label>Media Type</label>
                        <select id="post-category">
                            <option value="Series">Series</option>
                            <option value="Movies">Movies</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Genre / Type</label>
                        <select id="post-genre">
                            <option value="Anime">Anime</option>
                            <option value="Cartoon">Cartoon</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="text" id="post-image" placeholder="Image link">
                    </div>

                    <div class="form-group">
                        <label>Video Links (Google Drive or Mega links separated by commas ',' or lines)</label>
                        <textarea id="post-links" rows="6" placeholder="https://drive.google.com/..., https://mega.nz/..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Video Format</label>
                        <select id="post-video-ratio">
                            <option value="16:9">Widescreen (16:9)</option>
                            <option value="4:3">Classic (4:3)</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button id="submit-btn" onclick="saveUserPost()" style="background:var(--accent-color); color:white; border:none; padding:10px 20px; border-radius:5px; font-weight:bold; cursor:pointer; flex: 1;">Publish</button>
                        <button id="cancel-edit-btn" onclick="resetForm()" style="background:var(--danger-color); color:white; border:none; padding:10px 20px; border-radius:5px; font-weight:bold; cursor:pointer; display:none;">Cancel</button>
                    </div>
                </div>
                <p id="upload-warning" style="color: var(--danger-color); font-weight: bold; margin-top: 1rem;">Please login with your Google account to upload posts.</p>
            </div>

            <div id="series" class="section">
                <h2 class="section-title">All Series</h2>
                <div id="series-only-grid" class="grid"></div>
            </div>

            <div id="movies" class="section">
                <h2 class="section-title">All Movies</h2>
                <div id="movies-only-grid" class="grid"></div>
            </div>

            <div id="anime" class="section">
                <h2 class="section-title">All Anime</h2>
                <div id="anime-only-grid" class="grid"></div>
            </div>

            <div id="cartoon" class="section">
                <h2 class="section-title">All Cartoons</h2>
                <div id="cartoon-only-grid" class="grid"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showSection('home', this)">🏠 HOME</button>
        <button class="nav-item" onclick="showSection('search', this)">🔍 SEARCH</button>
        <button class="nav-item" onclick="showSection('upload', this)">➕ UPLOAD</button>
        <button class="nav-item" onclick="showSection('series', this)">📺 SERIES</button>
        <button class="nav-item" onclick="showSection('movies', this)">🎬 MOVIES</button>
        <button class="nav-item" onclick="showSection('anime', this)">⚡ ANIME</button>
        <button class="nav-item" onclick="showSection('cartoon', this)">🧸 CARTOON</button>
        <button class="nav-item" id="auth-nav-btn" onclick="toggleAuth()">👤 LOGIN</button>
    </nav>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBIzColODaVvjRm_XbRKHJLBAKSfeZdOkc", 
            authDomain: "login-6aeba.firebaseapp.com",
            projectId: "login-6aeba",
            storageBucket: "login-6aeba.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "arulmani0000@gmail.com"; 

        let allPosts = [];
        let currentAZ = "";
        let isAdmin = false;
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                isAdmin = (user.email === ADMIN_EMAIL);
            } else {
                isAdmin = false;
            }
            updateUI();
        });

        window.toggleAuth = async function() {
            if (currentUser) {
                if (confirm("Do you want to logout?")) {
                    try {
                        await signOut(auth);
                        alert("Logged out successfully!");
                    } catch (error) {
                        console.error("Logout error:", error);
                    }
                }
            } else {
                try {
                    await signInWithPopup(auth, provider);
                    alert("Login Successful!");
                } catch (error) {
                    console.error("Google Login Error:", error);
                    alert("Google Login Failed: " + error.message);
                }
            }
        }

        function updateUI() {
            const authNavBtn = document.getElementById('auth-nav-btn');
            const uploadForm = document.getElementById('upload-form-container');
            const uploadWarning = document.getElementById('upload-warning');
            const userStatus = document.getElementById('user-status');

            if (currentUser) {
                authNavBtn.innerText = "🚪 LOGOUT";
                userStatus.innerText = isAdmin ? `Admin: ${currentUser.email}` : `User: ${currentUser.email}`;
                uploadForm.style.display = "block";
                uploadWarning.style.display = "none";
            } else {
                authNavBtn.innerText = "👤 LOGIN";
                userStatus.innerText = "Not Logged In";
                uploadForm.style.display = "none";
                uploadWarning.style.display = "block";
                uploadWarning.innerText = "Please login with Google to upload posts.";
            }
            renderAllViews(allPosts);
        }

        window.saveUserPost = async function() {
            if (!currentUser) {
                alert("Please login first to publish posts!");
                return;
            }

            const postId = document.getElementById('edit-post-id').value;
            const title = document.getElementById('post-title').value.trim();
            const category = document.getElementById('post-category').value;
            const genre = document.getElementById('post-genre').value;
            const image = document.getElementById('post-image').value.trim();
            const newLinksInput = document.getElementById('post-links').value.trim();
            const videoRatio = document.getElementById('post-video-ratio').value;

            if(!title || !image) {
                alert("Please fill title and image URL!");
                return;
            }

            try {
                if (postId) {
                    const postToEdit = allPosts.find(p => p.id === postId);
                    if (!isAdmin && (!postToEdit || postToEdit.userEmail !== currentUser.email)) {
                        alert("Unauthorized! You can only edit posts created by you.");
                        return;
                    }

                    let updatedLinks = postToEdit.links || "";
                    if (newLinksInput) {
                        if (updatedLinks && !updatedLinks.trim().endsWith(",")) {
                            updatedLinks += ", ";
                        }
                        updatedLinks += newLinksInput;
                    }

                    await updateDoc(doc(db, "posts", postId), {
                        title, category, genre, image, links: updatedLinks,
                        videoRatio: videoRatio
                    });
                    alert("Post Updated & New Episodes Added Successfully!");
                } else {
                    await addDoc(collection(db, "posts"), {
                        title, category, genre, image, links: newLinksInput,
                        videoRatio: videoRatio,
                        views: 0,
                        userEmail: currentUser.email,
                        createdAt: new Date()
                    });
                    alert("Post Published Successfully!");
                }
                
                resetForm();
                fetchPosts();
                showSection('home', document.querySelector('.nav-item'));
            } catch (e) {
                console.error("Error saving document: ", e);
                alert("Error saving post.");
            }
        }

        window.editPost = function(id) {
            const post = allPosts.find(p => p.id === id);
            if (!post) return;

            if (!isAdmin && post.userEmail !== currentUser?.email) {
                alert("You are not allowed to edit this post!");
                return;
            }

            document.getElementById('edit-post-id').value = post.id;
            document.getElementById('post-title').value = post.title;
            document.getElementById('post-category').value = post.category || 'Series';
            document.getElementById('post-genre').value = post.genre || 'Anime';
            document.getElementById('post-image').value = post.image;
            document.getElementById('post-links').value = "";
            document.getElementById('post-video-ratio').value = post.videoRatio || '16:9';

            document.getElementById('form-heading').innerText = "Edit / Add Episodes";
            document.getElementById('submit-btn').innerText = "Update & Add Episodes";
            document.getElementById('cancel-edit-btn').style.display = "block";

            showSection('upload', document.querySelectorAll('.bottom-nav .nav-item')[2]);
        }

        window.deletePost = async function(id) {
            if (!isAdmin) {
                alert("Only Admin can delete posts!");
                return;
            }
            if (confirm("Are you sure you want to delete this post?")) {
                try {
                    await deleteDoc(doc(db, "posts", id));
                    alert("Post Deleted Successfully!");
                    fetchPosts();
                } catch (e) {
                    console.error("Error deleting post: ", e);
                    alert("Failed to delete post.");
                }
            }
        }

        window.resetForm = function() {
            document.getElementById('edit-post-id').value = '';
            document.getElementById('post-title').value = '';
            document.getElementById('post-image').value = '';
            document.getElementById('post-links').value = '';
            document.getElementById('post-video-ratio').value = '16:9';
            document.getElementById('form-heading').innerText = "Upload Post";
            document.getElementById('submit-btn').innerText = "Publish";
            document.getElementById('cancel-edit-btn').style.display = "none";
        }

        async function fetchPosts() {
            allPosts = [];
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                querySnapshot.forEach((docSnap) => {
                    allPosts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderAllViews(allPosts);
            } catch (e) {
                console.error("Error fetching posts: ", e);
            }
        }

        window.showSection = function(sectionId, btnElement) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');

            if(btnElement) {
                document.querySelectorAll('.bottom-nav .nav-item').forEach(item => item.classList.remove('active'));
                btnElement.classList.add('active');
            }
        }

        window.filterByAZ = function(letter, btnElement) {
            currentAZ = letter;
            document.querySelectorAll('.az-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderAllViews(allPosts);
        }

        window.handleSearch = function() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const searchGrid = document.getElementById('search-grid');
            if(!query) {
                searchGrid.innerHTML = "";
                return;
            }
            const filtered = allPosts.filter(p => p.title.toLowerCase().includes(query));
            renderGrid(filtered, 'search-grid');
        }

        function renderAllViews(posts) {
            let filtered = posts;
            if (currentAZ !== "") {
                filtered = posts.filter(p => p.title.toUpperCase().startsWith(currentAZ.toUpperCase()));
            }

            renderGrid(filtered.filter(p => p.category === 'Series'), 'series-grid');
            renderGrid(filtered.filter(p => p.category === 'Movies'), 'movies-grid');

            renderGrid(posts.filter(p => p.category === 'Series'), 'series-only-grid');
            renderGrid(posts.filter(p => p.category === 'Movies'), 'movies-only-grid');
            renderGrid(posts.filter(p => p.genre === 'Anime'), 'anime-only-grid');
            renderGrid(posts.filter(p => p.genre === 'Cartoon'), 'cartoon-only-grid');
        }

        function renderGrid(posts, elementId) {
            const grid = document.getElementById(elementId);
            if (!grid) return;
            
            if (posts.length === 0) {
                grid.innerHTML = "<p style='color:#64748b;'>No items available.</p>";
                return;
            }

            let html = '';
            posts.forEach(post => {
                let canEdit = currentUser && (isAdmin || post.userEmail === currentUser.email);
                let canDelete = currentUser && isAdmin;
                let viewCount = post.views || 0;

                html += `
                    <div class="card" onclick="openDetailPage('${post.id}')">
                        <div>
                            <img src="${post.image}" alt="${post.title}">
                            <h3>${post.title}</h3>
                            <div class="meta-info">
                                <span>${post.category}</span>
                                <span>👁️ ${viewCount} Views</span>
                            </div>
                        </div>
                        ${currentUser ? `
                            <div class="card-actions" onclick="event.stopPropagation()">
                                ${canEdit ? `<button class="edit-btn" onclick="editPost('${post.id}')">Edit</button>` : ''}
                                ${canDelete ? `<button class="delete-btn" onclick="deletePost('${post.id}')">Delete</button>` : ''}
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // Google Drive & Mega.nz Link to Embed URL Converter
        window.convertToEmbedUrl = function(url) {
            if (!url) return "";
            let trimmed = url.trim();

            // Google Drive Link
            if (trimmed.includes("drive.google.com")) {
                let fileId = "";
                let fileIdMatch = trimmed.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (fileIdMatch && fileIdMatch[1]) {
                    fileId = fileIdMatch[1];
                } else {
                    let idMatch = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                    if (idMatch && idMatch[1]) {
                        fileId = idMatch[1];
                    }
                }
                if (fileId) {
                    return `https://drive.google.com/file/d/${fileId}/preview`;
                }
            }

            // Mega.nz Link
            if (trimmed.includes("mega.nz")) {
                if (trimmed.includes("/embed/")) {
                    return trimmed;
                }
                if (trimmed.includes("/file/")) {
                    return trimmed.replace("/file/", "/embed/");
                }
                if (trimmed.includes("#!")) {
                    return trimmed.replace("#!", "embed/#!");
                }
                return trimmed;
            }

            return trimmed;
        }

        // Fullscreen Action
        window.openPlayerFullscreen = function() {
            const playerContainer = document.getElementById('video-player-container');
            if (!playerContainer) return;

            if (playerContainer.requestFullscreen) {
                playerContainer.requestFullscreen();
            } else if (playerContainer.webkitRequestFullscreen) {
                playerContainer.webkitRequestFullscreen();
            } else if (playerContainer.msRequestFullscreen) {
                playerContainer.msRequestFullscreen();
            }
        }

        window.openDetailPage = async function(id) {
            const post = allPosts.find(p => p.id === id);
            if (!post) return;

            try {
                let newViews = (post.views || 0) + 1;
                post.views = newViews;
                await updateDoc(doc(db, "posts", id), {
                    views: newViews
                });
            } catch (err) {
                console.error("Error updating views:", err);
            }

            document.getElementById('detail-title').innerText = post.title;
            document.getElementById('detail-img').src = post.image;
            document.getElementById('detail-meta').innerText = `Category: ${post.category} • Genre: ${post.genre}`;
            document.getElementById('detail-views').innerText = `👁️ Total Views: ${post.views || 0}`;

            const playerContainer = document.getElementById('video-player-container');
            playerContainer.className = `video-player-container ratio-${post.videoRatio === '4-3' ? '4-3' : '16-9'}`;

            const linksRaw = post.links || "";
            const linksArray = linksRaw.split(/,|\n/).map(l => l.trim()).filter(l => l.length > 0);

            const linksContainer = document.getElementById('detail-links-container');
            const mainPlayer = document.getElementById('main-video-player');

            let linksHtml = '';
            if (linksArray.length > 0) {
                mainPlayer.src = convertToEmbedUrl(linksArray[0]);

                linksArray.forEach((link, index) => {
                    let embedUrl = convertToEmbedUrl(link);
                    let activeClass = index === 0 ? 'active-ep' : '';
                    linksHtml += `
                        <button class="episode-btn ${activeClass}" onclick="playEpisode('${embedUrl}', this)">
                            ▶️ Episode / Part ${index + 1}
                        </button>
                    `;
                });
            } else {
                mainPlayer.src = "";
                linksHtml = "<p style='color:#64748b; text-align:center;'>No video links available.</p>";
            }
            linksContainer.innerHTML = linksHtml;

            document.getElementById('main-app-content').style.display = 'none';
            document.getElementById('detail-page').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.playEpisode = function(embedUrl, btnElement) {
            const mainPlayer = document.getElementById('main-video-player');
            mainPlayer.src = embedUrl;

            document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active-ep'));
            btnElement.classList.add('active-ep');
        }

        window.goBack = function() {
            document.getElementById('detail-page').classList.remove('active');
            document.getElementById('main-app-content').style.display = 'block';
            document.getElementById('main-video-player').src = "";
        }

        // Initial fetch
        fetchPosts();
    </script>
</body>
</html>
