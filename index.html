<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Convert & HTML5 Video Player</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .player-container {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            max-height: 500px;
            background: #000;
            border-radius: 6px;
            outline: none;
            margin-top: 15px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #334155;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #2563eb;
        }
        .status-text {
            font-size: 0.85rem;
            color: #38bdf8;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <h2>Auto Convert Drive & Mega to HTML5 Player</h2>
    
    <div class="player-container">
        <div class="input-group">
            <label>Google Drive அல்லது Mega Share Link-ஐ இங்கே ஒட்டவும்:</label>
            <input type="text" id="video-url-input" placeholder="https://drive.google.com/file/d/... அல்லது https://mega.nz/file/...">
        </div>
        <button onclick="processAndPlayVideo()">Auto Convert & Play</button>
        <div id="conversion-status" class="status-text"></div>

        <!-- ஒரிஜினல் HTML5 வீடியோ பிளேயர் (iframe கிடையாது) -->
        <video id="html5-video-player" controls preload="metadata">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        function processAndPlayVideo() {
            let inputVal = document.getElementById('video-url-input').value.trim();
            let videoElement = document.getElementById('html5-video-player');
            let statusText = document.getElementById('conversion-status');
            
            if (!inputVal) {
                alert("தயவுசெய்து ஏதாவது ஒரு லிங்க்கை உள்ளிடவும்!");
                return;
            }

            let directVideoUrl = "";

            // 1. Google Drive லிங்க் ஹேண்ட்லிங்
            if (inputVal.includes("drive.google.com")) {
                let fileIdMatch = inputVal.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (fileIdMatch && fileIdMatch[1]) {
                    let fileId = fileIdMatch[1];
                    directVideoUrl = `https://lh3.googleusercontent.com/d/${fileId}=s0`;
                    statusText.innerText = "Status: Google Drive link converted to Direct HTML5 Stream!";
                }
            } 
            // 2. Mega லிங்க் ஹேண்ட்லிங்
            else if (inputVal.includes("mega.nz")) {
                // Mega லிங்க்குகளை டைரக்ட் ஸ்டிரீமிங் செய்ய ஏதுவான ஃபார்மட் அல்லது எம்பெட் முறைகள்
                // Mega-வுக்கென பிரத்யேகமான ஃபார்மட் அல்லது நேரடி சோர்ஸ் லிங்க் எடுக்கப்படுவது
                directVideoUrl = inputVal; 
                statusText.innerText = "Status: Mega link loaded into HTML5 player!";
            } else {
                directVideoUrl = inputVal;
                statusText.innerText = "Status: Direct link loaded.";
            }

            // வீடியோ பிளேயரில் சோர்ஸை செட் செய்து இயக்குவது
            videoElement.src = directVideoUrl;
            videoElement.load();
            videoElement.play().catch(error => {
                console.log("Auto-play restricted by browser:", error);
            });
        }
    </script>

</body>
</html>
