<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure HTML5 Direct Video Player</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .player-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #475569;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #2563eb;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #38bdf8;
            background: #0f172a;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
        }
        /* ஐபிரேம் கிடையாது - ஒரிஜினல் HTML5 வீடியோ பிளேயர் ஸ்டைல் */
        video {
            width: 100%;
            max-height: 480px;
            background: #000;
            border-radius: 6px;
            margin-top: 20px;
            outline: none;
        }
    </style>
</head>
<body>

    <h2>Pure HTML5 Video Player (No Iframe)</h2>

    <div class="player-box">
        <div class="input-group">
            <label>Google Drive வீடியோ லிங்க்கை இங்கே ஒட்டவும்:</label>
            <input type="text" id="media-url" placeholder="https://drive.google.com/file/d/.../view">
        </div>
        <button onclick="playPureHTML5Video()">Convert & Play in HTML5</button>

        <div id="status-box" class="status-msg">Status: Ready</div>

        <!-- ஐபிரேம் இல்லாத அசல் HTML5 வீடியோ டேக் -->
        <video id="native-html5-player" controls preload="metadata">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        function playPureHTML5Video() {
            let inputUrl = document.getElementById('media-url').value.trim();
            let videoElement = document.getElementById('native-html5-player');
            let statusBox = document.getElementById('status-box');

            if (!inputUrl) {
                alert("தயவுசெய்து லிங்கை உள்ளிடவும்!");
                return;
            }

            let directStreamUrl = inputUrl;

            // Google Drive ஃபைல் ஐடியை மட்டும் தனiyாக பிரித்தெடுத்தல்
            if (inputUrl.includes("drive.google.com")) {
                let match = inputUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    let fileId = match[1];
                    
                    // கூகுள் டிரைவ் வீடியோவை நேரடியாக டவுன்லோட்/ஸ்ட்ரீம் செய்யும் அதிகாரப்பூர்வ பைனரி லிங்க் ஃபார்மட்
                    directStreamUrl = `https://docs.google.com/uc?export=download&id=${fileId}`;
                    
                    statusBox.innerText = "Converted to Direct Stream URL: " + directStreamUrl;
                }
            }

            // வீடியோ பிளேயருக்கு சோர்ஸை மாற்றுவது
            videoElement.pause();
            videoElement.src = directStreamUrl;
            videoElement.load();
            
            // பிளே செய்ய முயற்சிப்பது
            let playPromise = videoElement.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Autoplay blocked or format needs manual play click:", error);
                    statusBox.innerText += " | Note: Click the play button on the video player.";
                });
            }
        }
    </script>

</body>
</html>
