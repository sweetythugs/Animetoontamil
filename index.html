<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram HTML5 Video Player Test</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .player-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #475569;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #2563eb;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #38bdf8;
            background: #0f172a;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
        }
        /* அசல் HTML5 வீடியோ பிளேயர் ஸ்டைல் */
        video {
            width: 100%;
            max-height: 480px;
            background: #000;
            border-radius: 6px;
            margin-top: 20px;
            outline: none;
        }
    </style>
</head>
<body>

    <h2>Telegram Video HTML5 Player Test</h2>

    <div class="player-box">
        <div class="input-group">
            <label>டெலகிராம் வீடியோவின் டைரக்ட் ஃபைல் லிங்க்கை இங்கே ஒட்டவும்:</label>
            <input type="text" id="media-url" placeholder="https://... (Telegram Direct File Link)">
        </div>
        <button onclick="playTelegramVideo()">Play in HTML5 Player</button>

        <div id="status-box" class="status-msg">Status: Ready</div>

        <!-- ஐபிரேம் இல்லாத ஒரிஜினல் HTML5 வீடியோ டேக் -->
        <video id="html5-video-player" controls preload="metadata">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        function playTelegramVideo() {
            let inputUrl = document.getElementById('media-url').value.trim();
            let videoElement = document.getElementById('html5-video-player');
            let statusBox = document.getElementById('status-box');

            if (!inputUrl) {
                alert("தயவுசெய்து டெலகிராம் லிங்கை உள்ளிடவும்!");
                return;
            }

            statusBox.innerText = "Loaded URL: " + inputUrl;

            // வீடியோ பிளேயரில் சோர்ஸை செட் செய்து இயக்குவது
            videoElement.pause();
            videoElement.src = inputUrl;
            videoElement.load();
            
            let playPromise = videoElement.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Autoplay restricted:", error);
                    statusBox.innerText += " | Note: Click play button on the player.";
                });
            }
        }
    </script>

</body>
</html>
