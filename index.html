<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Video Player - Auto Convert</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .player-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #475569;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #2563eb;
        }
        video {
            width: 100%;
            max-height: 500px;
            background: #000;
            border-radius: 6px;
            margin-top: 20px;
            outline: none;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #38bdf8;
            background: #0f172a;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>HTML5 Video Player (Drive & Mega Direct Stream)</h2>

    <div class="player-box">
        <div class="input-group">
            <label>Google Drive அல்லது Mega வீடியோ லிங்க்கை இங்கே ஒட்டவும்:</label>
            <input type="text" id="media-url" placeholder="https://drive.google.com/file/d/... அல்லது Mega Link">
        </div>
        <button onclick="playVideo()">Convert & Play Video</button>

        <div id="status-box" class="status-msg">Status: Ready</div>

        <!-- ஐபிரேம் இல்லாத ஒரிஜினல் HTML5 வீடியோ டேக் -->
        <video id="html5-player" controls preload="metadata">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        function playVideo() {
            let inputUrl = document.getElementById('media-url').value.trim();
            let videoPlayer = document.getElementById('html5-player');
            let statusBox = document.getElementById('status-box');

            if (!inputUrl) {
                alert("தயவுசெய்து லிங்கை உள்ளிடவும்!");
                return;
            }

            let finalStreamUrl = inputUrl;

            // 1. Google Drive Link Conversion
            if (inputUrl.includes("drive.google.com")) {
                let match = inputUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    let fileId = match[1];
                    // டிரைவ் பைலை நேரடி ஸ்ட்ரீமிங் லிங்காக மாற்றுவது
                    finalStreamUrl = `https://lh3.googleusercontent.com/d/${fileId}=s0`;
                    statusBox.innerText = "Converted Drive Link: " + finalStreamUrl;
                }
            } 
            // 2. Mega Link Handling
            else if (inputUrl.includes("mega.nz")) {
                // Mega லிங்க்குகள் பிரவுசரில் நேரடியாக HTML5 டேக் மூலம் ஓட சிறப்பு ஸ்ட்ரீமிங் கீ தேவைப்படும்.
                // ஒருவேளை நேரடி லிங்க்காக மாறவில்லை என்றால் கீழே உள்ள ஃபால்பேக் லாஜிக் வேலை செய்யும்.
                finalStreamUrl = inputUrl;
                statusBox.innerText = "Loaded Mega Link: " + finalStreamUrl;
            } else {
                statusBox.innerText = "Loaded Direct URL: " + finalStreamUrl;
            }

            // வீடியோவை லோட் செய்து இயக்குவது
            videoPlayer.src = finalStreamUrl;
            videoPlayer.load();
            videoPlayer.play().catch(err => {
                console.log("Playback warning:", err);
                statusBox.innerText += " | Note: Click play button on player if autoplay is restricted.";
            });
        }
    </script>

</body>
</html>
