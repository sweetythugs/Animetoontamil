<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video.js HTML5 Player</title>
    <!-- Video.js சிடிஎன் (CDN) ஸ்டைல் ஷீட் -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .player-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #475569;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #2563eb;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #38bdf8;
            background: #0f172a;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
        }
        .video-container {
            margin-top: 20px;
        }
        /* Video.js பிளேயரை கஸ்டமைஸ் செய்ய */
        .video-js {
            width: 100%;
            height: 450px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h2>Video.js Direct Stream Player</h2>

    <div class="player-box">
        <div class="input-group">
            <label>Google Drive அல்லது Mega லிங்க்கை இங்கே ஒட்டவும்:</label>
            <input type="text" id="media-url" placeholder="https://drive.google.com/file/d/... அல்லது Mega Link">
        </div>
        <button onclick="playWithVideoJS()">Convert & Play</button>

        <div id="status-box" class="status-msg">Status: Ready</div>

        <div class="video-container">
            <!-- Video.js க்கான டேக் -->
            <video
                id="my-video-player"
                class="video-js vjs-big-play-centered vjs-theme-city"
                controls
                preload="auto"
                data-setup='{}'>
                <p class="vjs-no-js">
                    To view this video please enable JavaScript, and consider upgrading to a
                    web browser that supports HTML5 video
                </p>
            </video>
        </div>
    </div>

    <!-- Video.js ஜாவாஸ்கிரிப்ட் லைப்ரரி -->
    <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>

    <script>
        function playWithVideoJS() {
            let inputUrl = document.getElementById('media-url').value.trim();
            let statusBox = document.getElementById('status-box');

            if (!inputUrl) {
                alert("தயவுசெய்து லிங்கை உள்ளிடவும்!");
                return;
            }

            let finalStreamUrl = inputUrl;

            // 1. Google Drive Link Conversion
            if (inputUrl.includes("drive.google.com")) {
                let match = inputUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    let fileId = match[1];
                    finalStreamUrl = `https://lh3.googleusercontent.com/d/${fileId}=s0`;
                    statusBox.innerText = "Converted Drive Link: " + finalStreamUrl;
                }
            } 
            // 2. Mega Link Handling
            else if (inputUrl.includes("mega.nz")) {
                finalStreamUrl = inputUrl;
                statusBox.innerText = "Loaded Mega Link: " + finalStreamUrl;
            } else {
                statusBox.innerText = "Loaded Direct URL: " + finalStreamUrl;
            }

            // Video.js பிளேயர் மூலமாக சோர்ஸை மாற்றி இயக்குவது
            var player = videojs('my-video-player');
            player.src({ type: 'video/mp4', src: finalStreamUrl });
            player.load();
            player.play().catch(err => {
                console.log("Playback blocked:", err);
                statusBox.innerText += " | Note: Click play on player.";
            });
        }
    </script>

</body>
</html>
