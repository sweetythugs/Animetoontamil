<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Embed Video Player</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .player-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #475569;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #2563eb;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #38bdf8;
            background: #0f172a;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            margin-top: 20px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2>Auto Embed Video Player (Drive & Mega)</h2>

    <div class="player-box">
        <div class="input-group">
            <label>Google Drive அல்லது Mega லிங்க்கை இங்கே ஒட்டவும்:</label>
            <input type="text" id="media-url" placeholder="https://drive.google.com/file/d/... அல்லது Mega Link">
        </div>
        <button onclick="playEmbeddedVideo()">Auto Convert & Play</button>

        <div id="status-box" class="status-msg">Status: Ready</div>

        <div class="iframe-container" id="player-wrapper" style="display:none;">
            <!-- ஆட்டோமேட்டிக்காக மாறக்கூடிய ஐபிரேம் ஃபிரேம் -->
            <iframe id="video-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function playEmbeddedVideo() {
            let inputUrl = document.getElementById('media-url').value.trim();
            let statusBox = document.getElementById('status-box');
            let playerWrapper = document.getElementById('player-wrapper');
            let videoIframe = document.getElementById('video-iframe');

            if (!inputUrl) {
                alert("தயவுசெய்து லிங்கை உள்ளிடவும்!");
                return;
            }

            let embedUrl = "";

            // 1. Google Drive Link Conversion to Preview Embed
            if (inputUrl.includes("drive.google.com")) {
                let match = inputUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    let fileId = match[1];
                    // கூகுள் டிரைவ் அதிகாரப்பூர்வ ப்ரிவ்யூ எம்பெட் லிங்க்
                    embedUrl = `https://drive.google.com/file/d/${fileId}/preview`;
                    statusBox.innerText = "Status: Converted Google Drive to Secure Embed Player!";
                }
            } 
            // 2. Mega Link Handling
            else if (inputUrl.includes("mega.nz")) {
                // Mega லிங்க்குகளை எம்பெட் செய்யும் முறை
                embedUrl = inputUrl;
                statusBox.innerText = "Status: Loaded Mega Link!";
            } else {
                embedUrl = inputUrl;
                statusBox.innerText = "Status: Loaded URL!";
            }

            if (embedUrl) {
                videoIframe.src = embedUrl;
                playerWrapper.style.display = "block";
            }
        }
    </script>

</body>
</html>
